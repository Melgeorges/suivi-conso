app = "suivi-conso"
primary_region = "cdg"

[build]

[env]
  PORT = "3001"
  DB_PATH = "/data/suivi.db"

[http_service]
  internal_port = 3001
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

[[vm]]
  memory = "256mb"
  cpu_kind = "shared"
  cpus = 1

[[mounts]]
  source = "suivi_data"
  destination = "/data"
  initial_size = "1gb"
